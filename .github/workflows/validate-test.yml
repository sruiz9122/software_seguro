name: Test workflow

on:
  push:
    branches:
      - '*'

jobs:
  code-validation:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        working-directory: .
        run: go mod vendor

      - name: Check unit test
        working-directory: .
        run: go test ./...